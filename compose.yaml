services:
  app:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - IGDB_AUTH_URL=${IGDB_AUTH_URL}
      - IGDB_API_URL=${IGDB_API_URL}
      - TMDB_API_TOKEN=${TMDB_API_TOKEN}
      - TMDB_API_KEY=${TMDB_API_KEY}